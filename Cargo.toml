[workspace]
resolver = "2"
members = [
    "crates/nav-core",
    "crates/nav-service",
    "crates/navctl",
    "crates/navd",
    "crates/navnotify",
    "crates/xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
repository = "https://github.com/yatt-ze/Not-An-Anti-Virus"
rust-version = "1.75"

[workspace.dependencies]
nav-core = { path = "crates/nav-core" }
nav-service = { path = "crates/nav-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"
