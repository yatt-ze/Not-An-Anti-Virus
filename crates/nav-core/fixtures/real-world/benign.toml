# Benign survey set (§11.1b): software a candidate rule could hit but the
# real-machine corpus does not hold. Maintainer-only; never fetched on the host.
#
# One [[item]] per entry. `category`: admin-scripts, dev-tools, drm,
# credentials, messaging, security-agent, remote-access, installer.
# `kind`: dmg, pkg, zip, tar, app (a zipped .app), script, git.
# A url item records `sha256` and `bytes`; a git item pins a full `commit`.
# New items are added without hashes, then recorded inside the VM with
# `cargo xtask benign fetch --record` and the rewritten file committed.

