[package]
name = "xtask"
description = "Dev runner: nav-service install/uninstall/residue in --fake (CI) or --real (sudo) mode (§11.10), and the real-machine corpus scan/diff/compare false-positive check."
publish = false
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
nav-core = { workspace = true }
nav-service = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
