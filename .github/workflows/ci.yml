# CI for NAV. Mirrors the "Before every commit" checklist in CLAUDE.md:
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
# plus a build of the nightly-only fuzz targets (crates/nav-core/fuzz is a
# separate workspace by design, so it is not covered by --workspace).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the real target (code-signing / quarantine-xattr paths are
        # macOS-only); Linux keeps the cross-platform fallback paths honest.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nav-core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Compile-only: catches bitrot in the harnesses without spending CI time
      # actually fuzzing. Sustained fuzzing runs belong elsewhere (design doc
      # §11.9 / §12 Phase 0c).
      - run: cargo fuzz build
        working-directory: crates/nav-core
