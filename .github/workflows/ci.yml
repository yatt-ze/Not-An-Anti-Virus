# CI for NAV. Mirrors the "Before every commit" checklist in CLAUDE.md:
#   cargo fmt --all -- --check
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo test --workspace
# plus a build of the nightly-only fuzz targets (crates/nav-core/fuzz is a
# separate workspace by design, so it is not covered by --workspace), a
# supply-chain advisory-DB check (§11, NAV-017), and cargo xtask verify
# --fake (install/uninstall/residue orchestration, §11.10) on both runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Drives fuzz-run only (see its `if`) — bounded fuzzing stays off the PR
  # path so it doesn't slow every push. workflow_dispatch allows an ad hoc
  # opt-in run.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: clippy + test (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the real target (code-signing / quarantine-xattr paths are
        # macOS-only); Linux keeps the cross-platform fallback paths honest.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: verify install/uninstall (fake prefix)
        run: cargo run --locked -p xtask -- verify --fake

  audit:
    name: cargo audit
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-build:
    name: fuzz targets build (compile-only)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nav-core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Compile-only: catches bitrot in the harnesses on every PR without
      # spending PR time actually fuzzing. Bounded fuzzing runs nightly
      # instead, in fuzz-run below (NAV-014). `--target` is pinned to the gnu
      # triple: cargo-fuzz otherwise builds for musl, whose static libc is
      # incompatible with ASan.
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu
        working-directory: crates/nav-core

  fuzz-run:
    name: bounded fuzz run (nightly)
    # Off the PR path by design (NAV-014) — scheduled, or manually via
    # workflow_dispatch. Priority order per the issue: xml/plist, xar, cpio,
    # inflate, bzip2, then macho; zip was added after.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nav-core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus each run grows is carried to the next one, so coverage
      # accumulates. Cache entries are immutable: save under a fresh key and
      # restore the newest earlier one by prefix.
      - name: restore grown fuzz corpus
        uses: actions/cache@v4
        with:
          path: crates/nav-core/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # fuzz/corpus is gitignored, so seed every target from the committed
      # vectors; an empty corpus spends the run rediscovering magic numbers.
      # Seeds are named by content hash, as libFuzzer names its own, so
      # same-named vectors (bomb.in, Info.plist) don't overwrite each other.
      - name: seed fuzz corpora
        working-directory: crates/nav-core
        run: |
          set -euo pipefail
          seed() {
            local target=$1; shift
            mkdir -p "fuzz/corpus/${target}"
            for f in "$@"; do
              cp -- "$f" "fuzz/corpus/${target}/$(sha1sum < "$f" | cut -c1-40)"
            done
            echo "${target}: $(ls "fuzz/corpus/${target}" | wc -l) inputs"
          }
          seed bzip2 testdata/bzip2/*.in
          # The inflate target tries raw deflate, zlib and gzip on each input.
          seed inflate testdata/inflate/*.in testdata/gzip/*.in
          seed parse_cpio testdata/cpio/*.cpio
          seed parse_xar testdata/xar/*.xar testdata/xar/*.pkg fixtures/*/*.pkg
          seed parse_zip testdata/zip/*.zip fixtures/*/*.zip
          plists=()
          while IFS= read -r -d '' f; do plists+=("$f"); done \
            < <(find fixtures -name '*.plist' -print0)
          seed parse_plist "${plists[@]}"
          # Mach-O by magic (thin 32/64-bit either endian, fat), not by name.
          machos=()
          while IFS= read -r -d '' f; do
            case "$(od -An -tx1 -N4 "$f" | tr -d ' \n')" in
              feedface|cefaedfe|feedfacf|cffaedfe|cafebabe) machos+=("$f") ;;
            esac
          done < <(find fixtures -type f -print0)
          seed parse_macho "${machos[@]}"
      # 60s/target bounds wall-clock (~5min total) rather than depth. With the
      # seeds and the carried corpus, the time goes to the deep decode paths.
      - name: bounded fuzz run
        working-directory: crates/nav-core
        run: |
          set -euo pipefail
          for target in parse_plist parse_xar parse_cpio inflate bzip2 parse_macho parse_zip; do
            echo "::group::fuzz ${target} (60s)"
            cargo fuzz run --target x86_64-unknown-linux-gnu "${target}" -- -max_total_time=60
            echo "::endgroup::"
          done
