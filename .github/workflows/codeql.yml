# CodeQL advanced setup; replaces GitHub's default setup so test and
# tooling paths can be ignored (see codeql/codeql-config.yml). Only Rust and
# the workflows themselves are scanned: every Python/JS file in the repo is a
# fixture or a test-data generator.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
