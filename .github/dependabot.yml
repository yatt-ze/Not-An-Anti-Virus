# Keeps the SHA-pinned actions and the two lockfiles current. Monthly and
# grouped (one PR per ecosystem and directory) to keep PR noise low; work
# lands in staging like any other PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories: ["/", "/crates/nav-core/fuzz"]
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
